name: Verify distribution

on:
  push:
    branches: [main, macos-arm64, linux-x64, windows-x64]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify pins and package bytes
        run: python scripts/verify.py
      - name: Native MCP smoke when distribution matches runner
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from verify import native_platform
          metadata = pathlib.Path('distribution.json')
          if metadata.exists() and json.loads(metadata.read_text())['platform'] == native_platform():
              subprocess.run([sys.executable, 'scripts/verify.py', '--smoke'], check=True)
          else:
              print('No matching native distribution on this branch; byte checks completed.')
